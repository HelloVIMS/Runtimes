name: Build moltworker (Cloudflare sandbox)

# Builds cloudflare/moltworker at a pinned upstream commit with VIMS's patches
# (patches/moltworker/*.patch) and publishes what VIMS needs to deploy it to a
# user's Cloudflare account through the API alone — no Docker, Node or
# wrangler on the user's machine:
#
#   ghcr.io/hellovims/moltworker@sha256:…   the linux/amd64 container image
#   release moltworker-<sha12>-<patch8>      moltworker-bundle.tar.gz + manifest.json
#   release moltworker-latest                the same assets, rolling
#
# VIMS copies the image into the account's registry.cloudflare.com namespace
# (Durable Object-managed containers only run digest-pinned images from it),
# then uploads the modules and assets listed in manifest.json.

on:
  push:
    branches: [main]
    paths:
      - 'patches/moltworker/**'
      - 'scripts/moltworker-bundle.mjs'
      - '.github/workflows/build-moltworker.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: https://github.com/cloudflare/moltworker
  UPSTREAM_SHA: 7b00c1d7292190f2327e93bdcc7a0eabb0a26123
  IMAGE: ghcr.io/hellovims/moltworker
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve version
        id: v
        shell: bash
        run: |
          patch8=$(cat patches/moltworker/*.patch scripts/moltworker-bundle.mjs | sha256sum | cut -c1-8)
          echo "version=moltworker-${UPSTREAM_SHA:0:12}-${patch8}" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream and apply patches
        shell: bash
        run: |
          git init -q src && cd src
          git remote add origin "$UPSTREAM_REPO"
          git fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
          for p in ../patches/moltworker/*.patch; do
            echo "applying $p"
            git apply --whitespace=nowarn "$p"
          done

      - name: Install and build worker
        working-directory: src
        run: |
          npm ci
          npm test
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: img
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - name: Package bundle
        shell: bash
        run: |
          ref="${IMAGE}@${{ steps.img.outputs.digest }}"
          node scripts/moltworker-bundle.mjs src bundle "${{ steps.v.outputs.version }}" "$ref"
          tar -C bundle -czf moltworker-bundle.tar.gz .
          cp bundle/manifest.json manifest.json
          sha256sum moltworker-bundle.tar.gz | cut -d' ' -f1 > moltworker-bundle.tar.gz.sha256

      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.v.outputs.version }}"
          assets=(moltworker-bundle.tar.gz moltworker-bundle.tar.gz.sha256 manifest.json)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "moltworker @ ${UPSTREAM_SHA:0:12} (${tag##*-})" \
              --notes "cloudflare/moltworker@${UPSTREAM_SHA} with patches/moltworker. Image: ${IMAGE}@${{ steps.img.outputs.digest }}" \
              --prerelease --latest=false
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          if ! gh release view moltworker-latest >/dev/null 2>&1; then
            gh release create moltworker-latest --title "moltworker (latest)" \
              --notes "Rolling: the most recent moltworker build. Pinned builds are the moltworker-<sha>-<patch> prereleases." \
              --prerelease --latest=false
          fi
          gh release upload moltworker-latest "${assets[@]}" --clobber
          gh release edit moltworker-latest --notes "Rolling: ${tag}. Image: ${IMAGE}@${{ steps.img.outputs.digest }}"
